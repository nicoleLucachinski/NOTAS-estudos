<!DOCTYPE html>
<html lang="en">
<head>
   
</head>
<body>
    <h1>Lista de números</h1>  
  <ul id="lista"></ul>  
  

  <script>  
let tag = document.getElementById("lista");
  
    for (let i = 1; i <= 1000; i++) {  
        if (i% 2 === 0){
      tag.innerHTML += "<li>Número " + i + "</li>";  
    }  
}
</script>
</body> 
</html>
