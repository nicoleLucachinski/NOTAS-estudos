<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
</head>
<body>

    <div>
        <label>Primeiro número:</label>
        <input type="number" id="n1">
    </div>

    <br>

    <div>
        <label>Segundo número:</label>
        <input type="number" id="n2">
    </div>

    <br>

    <div>
        <button onclick="somar()">Somar</button>
        <button onclick="subtrair()">subtrair</button>
    </div>

    <hr>

    <div id="resultado soma"></div>
<div id="resultado subtrair"></div>
    <script>
        function somar() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let resultado = document.getElementById("resultado soma");

            resultado.innerText = "Resultado: " + calcular(num1, num2);
        }
        function subtrair() {
            let num1 = Number(document.getElementById("n1").value);
            let num2 = Number(document.getElementById("n2").value);
            let resultado = document.getElementById("resultado subtrair");

            resultado.innerText = "Resultado: " + (num1 - num2);
        }
        function calcular(n1, n2) {
            return n1 + n2;
        }
    </script>

</body>
</html>
