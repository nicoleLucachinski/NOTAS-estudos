<!DOCTYPE html>

<body>
    <h1>Lista de números</h1>  
  <ul id="lista"></ul>  
  </body> 

  <script>  
let maximo = number(prompt("ate que numeor você quer?"));
let tag = document.getElementById("lista");
  
    for (let x = 1; x <= maximo; x++) {  
      tag.innerHTML += "<li>Número " + x + "</li>";  
    }  
  
</script>

</html>
